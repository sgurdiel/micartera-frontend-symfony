name: PHPUnit test & Static code analysis

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - LICENSE
      - 'translations/**'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - LICENSE
      - 'translations/**'

env:
  XDEBUG_MODE: coverage

permissions:
  contents: write

jobs:
  load-versions:
    name: Load runtime versions
    runs-on: ubuntu-latest
    outputs:
      release_php: ${{ steps.set-outputs.outputs.release_php }}
      release_mysql: ${{ steps.set-outputs.outputs.release_mysql }}
      release_node: ${{ steps.set-outputs.outputs.release_node }}
      release_opentelemetry: ${{ steps.set-outputs.outputs.release_opentelemetry }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Read versions.env
        id: set-outputs
        run: |
          release_php=$(grep -E '^RELEASE_PHP=' versions.env | cut -d'=' -f2- | tr -d '\r')
          release_mysql=$(grep -E '^RELEASE_MYSQL=' versions.env | cut -d'=' -f2- | tr -d '\r')
          release_node=$(grep -E '^RELEASE_NODE=' versions.env | cut -d'=' -f2- | tr -d '\r')
          release_opentelemetry=$(grep -E '^RELEASE_OPENTELEMETRY=' versions.env | cut -d'=' -f2- | tr -d '\r')
          echo "release_php=$release_php" >> "$GITHUB_OUTPUT"
          echo "release_mysql=$release_mysql" >> "$GITHUB_OUTPUT"
          echo "release_node=$release_node" >> "$GITHUB_OUTPUT"
          echo "release_opentelemetry=$release_opentelemetry" >> "$GITHUB_OUTPUT"

  build:
    name: micartera-frontend-symfony
    needs: load-versions

    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:${{ needs.load-versions.outputs.release_mysql }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: false
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: micartera_test
          MYSQL_HOST: 127.0.0.1
        ports:
          - 3306:3306/tcp
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    env:
      RELEASE_PHP: ${{ needs.load-versions.outputs.release_php }}
      RELEASE_MYSQL: ${{ needs.load-versions.outputs.release_mysql }}
      RELEASE_NODE: ${{ needs.load-versions.outputs.release_node }}
      RELEASE_OPENTELEMETRY: ${{ needs.load-versions.outputs.release_opentelemetry }}
      APP_ENV: test
      APP_RELEASE: test
      APP_SECRET: kv95njkb5t90v89jtrbjh3bvdv
      DATABASE_URL: mysql://root:password@127.0.0.1:3306/micartera?serverVersion=${{ needs.load-versions.outputs.release_mysql }}
      TRUSTED_PROXIES:
      SYMFONY_DEPRECATIONS_HELPER: disabled=1

    strategy:
      fail-fast: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        ref: ${{ github.head_ref || github.ref_name }}
    
    - name: Setup devbox
      uses: jetify-com/devbox-install-action@v0.15.0
      with:
        # Caching the entire Nix store in github based on your devbox.json
        enable-cache: true
    
    - name: Setup mise
      uses: jdx/mise-action@v4
      with:
        install: true
        cache: true

    - name: Validate composer.json and composer.lock
      run: devbox run composer validate --strict

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v6
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-

    - name: Install dependencies
      run: devbox run composer install --prefer-dist --no-progress --optimize-autoloader

    - name: Update outdated Symfony recipes
      env:
        BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      run: |
        set -euo pipefail

        set +e
        recipes_output=$(devbox run composer recipes --outdated 2>&1)
        recipes_status=$?
        set -e

        printf '%s\n' "$recipes_output"

        if [ "$recipes_status" -eq 0 ]; then
          exit 0
        fi

        packages=$(printf '%s\n' "$recipes_output" | awk '/^[[:space:]]*\* / && /\(update available\)/ { print $2 }')

        if [ -z "$packages" ]; then
          echo "No automatically updateable Symfony recipes found."
          exit 0
        fi

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        initial_head=$(git rev-parse HEAD)
        update_failed=0

        for package in $packages; do
          echo "Updating Symfony recipe for $package"

          set +e
          devbox run composer recipes:update "$package" --no-interaction --no-changelog
          update_status=$?
          set -e

          if [ "$update_status" -ne 0 ] || [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo "Recipe update for $package failed or produced conflicts. Resolve it manually."
            git status --short
            git reset --hard HEAD
            git clean -fd
            update_failed=1
            continue
          fi

          git add -A

          if git diff --cached --quiet; then
            echo "Recipe update for $package produced no changes."
            continue
          fi

          git commit -m "Update Symfony recipe for $package"
        done

        if [ "$(git rev-parse HEAD)" = "$initial_head" ]; then
          echo "No recipe update commits were created."
          if [ "$update_failed" -ne 0 ]; then
            exit 1
          fi
          exit 0
        fi

        if [ "$IS_FORK_PR" = "true" ]; then
          echo "Pull request is from a fork; recipe updates were created but cannot be pushed by this workflow."
          exit 1
        fi

        git fetch origin "$BRANCH_NAME"

        if git merge-base --is-ancestor "origin/$BRANCH_NAME" HEAD; then
          git push origin "HEAD:$BRANCH_NAME"
        else
          echo "Remote branch moved; not pushing because it would not be a fast-forward."
          exit 1
        fi

        if [ "$update_failed" -ne 0 ]; then
          echo "One or more recipe updates failed or produced conflicts."
          exit 1
        fi

    - name: Run Database setup
      run: |
        devbox run bin/console doctrine:database:create --if-not-exists --env=test || echo "Schema creation failed"
        devbox run bin/console doctrine:schema:drop --force --env=test || echo "Schema drop failed"
        devbox run bin/console doctrine:schema:create --env=test || echo "Schema create failed"
        devbox run bin/console doctrine:fixtures:load --no-interaction --env=test || echo "Fixtures load failed"

    - name: Install NPM dependencies
      run: npm ci

    - name: NPM Build
      run: npm run build

    - name: Run all test suites
      run: devbox run vendor/bin/phpunit --testsuite=all --coverage-text
       
    - name: Psalm static code analysis
      run: devbox run vendor/bin/psalm

    - name: Build Docker image
      run: |
        set -a
        . ./versions.env
        set +a
        docker build --build-arg RELEASE_PHP --build-arg RELEASE_NODE --build-arg RELEASE_OPENTELEMETRY .
